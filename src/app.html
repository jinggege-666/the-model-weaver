<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
	<meta http-equiv="Pragma" content="no-cache">
	<meta http-equiv="Expires" content="0">
	<script>
		// WeChat's in-app browser can keep an old GitHub Pages shell for a long time.
		// Give this release a stable cache-busting URL before the app starts.
		(() => {
			const release = 'jinge-20260827-3';
			const url = new URL(window.location.href);
			if (url.searchParams.get('v') !== release) {
				url.searchParams.set('v', release);
				window.location.replace(url.toString());
			}
		})();
	</script>

	<title>JINGE — AI Trainer & Product Designer</title>

	<link rel="icon" href="%sveltekit.assets%/favicon.ico" />

	<!-- Self-hosted fonts (load from GitHub Pages, not blocked in China) -->
	<style>
		@font-face { font-family:'Questrial'; font-style:normal; font-weight:400; src:url('%sveltekit.assets%/fonts/Questrial.woff2') format('woff2'); font-display:swap; }
		@font-face { font-family:'Playfair Display'; font-style:normal; font-weight:700; src:url('%sveltekit.assets%/fonts/PlayfairDisplay-Bold.woff2') format('woff2'); font-display:swap; }
	</style>

	<!-- Font imports in global.css  -->

	<!-- SEO -->
	<meta name="keywords" content="The Model Weaver, Model Weaver, AI Trainer, Product Designer, Portfolio, Design, AI Art">
	<meta name="author" content="JINGE">
	<meta http-equiv="content-type" content="text/html" charset="UTF-8">
	<meta name="description" content="Portfolio and personal website of JINGE, an AI trainer and product designer from Yancheng, China.">

	%sveltekit.head%
</head>

<body>
	<div style="display: contents">
		%sveltekit.body%
	</div>
</body>

</html>
