<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0d" />
  <meta name="description" content="JINGE · 瞬间照相馆 客片作品集" />
  <title>JINGE · 瞬间照相馆</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div id="app">

    <!-- ========== 首页 ========== -->
    <section id="view-home" class="view active" aria-label="首页">
      <header class="topbar">
        <div class="brand">
          <span class="brand-name">JINGE</span>
          <span class="brand-sub">瞬间照相馆</span>
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="btn-search" aria-label="搜索">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          </button>
          <button class="icon-btn" aria-label="更多">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
          </button>
        </div>
      </header>

      <!-- 轮播 -->
      <div class="hero" id="hero">
        <div class="hero-track" id="heroTrack"></div>
        <div class="hero-dots" id="heroDots"></div>
        <button class="hero-arrow left" id="heroPrev" aria-label="上一张">‹</button>
        <button class="hero-arrow right" id="heroNext" aria-label="下一张">›</button>
      </div>

      <!-- 菜单 -->
      <nav class="menu" aria-label="快捷入口">
        <a class="menu-item" data-page="works">
          <span class="menu-ico"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="4" width="18" height="16" rx="2.2"/><circle cx="8.6" cy="9.4" r="1.7"/><path d="M3 17l5-5 4 4 3-3 6 6"/></svg></span>
          <span class="menu-txt">客样片</span>
        </a>
        <a class="menu-item" data-page="contact">
          <span class="menu-ico"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 5h4l2 5-2.5 1.5a13 13 0 0 0 5 5L14 14l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 2 7a2 2 0 0 1 2-2z"/></svg></span>
          <span class="menu-txt">联系</span>
        </a>
        <a class="menu-item" data-page="story">
          <span class="menu-ico"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 5a2 2 0 0 1 2-2h12v16H7a2 2 0 0 0-2 2V5z"/><path d="M5 19a2 2 0 0 0 2 2h12"/></svg></span>
          <span class="menu-txt">故事</span>
        </a>
        <a class="menu-item" data-page="review">
          <span class="menu-ico"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M21 11a8 8 0 0 1-8 8H5l-2 2V11a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/><path d="M8 11h8M8 14h5"/></svg></span>
          <span class="menu-txt">评价</span>
        </a>
      </nav>

      <!-- 精选作品 -->
      <section class="section">
        <div class="section-head">
          <h2 class="section-title">精选作品</h2>
          <button class="more-link" data-page="works">查看全部 ›</button>
        </div>
        <div class="strip" id="featStrip"></div>
      </section>

      <!-- 底部留白(给 tabbar) -->
      <div class="tab-space"></div>
    </section>

    <!-- ========== 作品 ========== -->
    <section id="view-works" class="view" aria-label="作品">
      <header class="page-head">
        <button class="back-btn" data-page="home" aria-label="返回">‹</button>
        <h1 class="page-title">作品</h1>
        <span class="page-head-spacer"></span>
      </header>
      <div class="chips" id="chips"></div>
      <div class="grid" id="grid"></div>
      <div class="tab-space"></div>
    </section>

    <!-- ========== 我的 ========== -->
    <section id="view-me" class="view" aria-label="我的">
      <header class="page-head">
        <span class="page-head-spacer"></span>
        <h1 class="page-title">我的</h1>
        <span class="page-head-spacer"></span>
      </header>

      <div class="profile">
        <img class="avatar" src="images/avatar.png" alt="头像" loading="lazy" decoding="async" />
        <div class="profile-info">
          <div class="profile-name">JINGE</div>
          <div class="profile-sub">瞬间照相馆 · 摄影工作室</div>
        </div>
      </div>

      <ul class="cell-group">
        <li class="cell" data-page="works">
          <span class="cell-ico">🖼</span><span>我的客片</span><span class="cell-arrow">›</span>
        </li>
        <li class="cell" data-page="story">
          <span class="cell-ico">📖</span><span>品牌故事</span><span class="cell-arrow">›</span>
        </li>
        <li class="cell" data-page="review">
          <span class="cell-ico">⭐</span><span>客片评价</span><span class="cell-arrow">›</span>
        </li>
        <li class="cell" data-page="contact">
          <span class="cell-ico">☎</span><span>联系我</span><span class="cell-arrow">›</span>
        </li>
      </ul>

      <div class="about">
        <p>JINGE · 瞬间照相馆</p>
        <p class="about-dim">本站为个人作品集展示，需要原图请联系我</p>
      </div>
      <div class="tab-space"></div>
    </section>

    <!-- ========== 子页面(联系/故事/评价/搜索) 复用一层 ========== -->
    <div id="subsheet" class="subsheet" hidden>
      <header class="page-head">
        <button class="back-btn" id="subsheet-back" aria-label="返回">‹</button>
        <h1 class="page-title" id="subsheet-title">标题</h1>
        <span class="page-head-spacer"></span>
      </header>
      <div id="subsheet-body" class="subsheet-body"></div>
      <div class="tab-space"></div>
    </div>

    <!-- 大图查看 -->
    <div id="lightbox" class="lightbox" hidden>
      <button class="lb-close" id="lb-close" aria-label="关闭">✕</button>
      <img id="lb-img" src="" alt="" />
      <div class="lb-cap" id="lb-cap"></div>
    </div>

    <!-- ========== 底部导航 ========== -->
    <nav class="tabbar" aria-label="主导航">
      <button class="tab active" data-tab="home">
        <span class="tab-ico"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9"/></svg></span>
        <span class="tab-txt">首页</span>
      </button>
      <button class="tab" data-tab="works">
        <span class="tab-ico"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2.2"/><circle cx="8.6" cy="9.4" r="1.7"/><path d="M3 17l5-5 4 4 3-3 6 6"/></svg></span>
        <span class="tab-txt">作品</span>
      </button>
      <button class="tab" data-tab="me">
        <span class="tab-ico"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>
        <span class="tab-txt">我的</span>
      </button>
    </nav>
  </div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
